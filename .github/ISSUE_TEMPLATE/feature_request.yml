name: Feature request
description: Suggest a new sentence type, export format or capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flags, output format or API you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
