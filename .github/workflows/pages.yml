name: Docs and coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen
          pip install --quiet gcovr==8.8
      - name: Build with coverage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNMEA_COVERAGE=ON
          cmake --build build -j "$(nproc)"
          ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: |
          mkdir -p site/coverage
          gcovr -r . --filter 'src/' --filter 'include/' --exclude-throw-branches \
            --html-details site/coverage/index.html --json-summary site/coverage/summary.json \
            --print-summary build
          python3 - <<'PY'
          import json
          pct = json.load(open("site/coverage/summary.json"))["line_percent"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellow" if pct >= 70 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.1f}%", "color": color}
          json.dump(badge, open("site/coverage/badge.json", "w"))
          print(badge)
          PY
      - name: API documentation
        run: |
          doxygen Doxyfile
          cp -r build/docs/html/. site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
